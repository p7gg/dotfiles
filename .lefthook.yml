# Local Git hooks. Install once with: lefthook install
pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --redact --verbose
    shellcheck:
      glob: "*.sh"
      run: shellcheck {staged_files}
    shfmt:
      glob: "*.sh"
      run: shfmt -d {staged_files}
    fish:
      glob: "*.fish"
      run: fish --no-execute {staged_files}
    fish-format:
      glob: "*.fish"
      run: fish_indent --check {staged_files}
    whitespace:
      run: git diff --cached --check
