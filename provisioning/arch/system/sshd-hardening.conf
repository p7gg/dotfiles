# /etc/ssh/sshd_config.d/10-hardening.conf
# Managed by dotfiles; installed by setup_sshd_hardening() in provisioning/arch/bootstrap.sh.
# sshd uses the first value it sees and the main config includes this directory
# first, so these override 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
AuthenticationMethods publickey
PermitEmptyPasswords no
# Key-only auth removes the password brute-force surface. Keep the default
# budget so a client agent that offers several keys cannot exhaust the tries
# before reaching the authorized key.
MaxAuthTries 6
LoginGraceTime 30
UseDNS no
GSSAPIAuthentication no
AllowAgentForwarding no
X11Forwarding no
