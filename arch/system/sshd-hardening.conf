# /etc/ssh/sshd_config.d/10-hardening.conf
# Managed by dotfiles; installed by setup_sshd_hardening() in arch/bootstrap.sh.
# sshd uses the first value it sees and the main config includes this directory
# first, so these override 99-archlinux.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
