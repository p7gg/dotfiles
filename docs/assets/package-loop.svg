<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Package maintenance loop</title>
  <desc id="desc">Install a package, record it in the matching package list, audit for drift, and commit the list change. Repeat when drift appears.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#131a14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/>
    </marker>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#bg)"/>
  <text x="48" y="60" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="29" font-weight="700">The package loop</text>
  <text x="48" y="90" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14">Install first, then record it. Audit keeps the tracked lists honest.</text>

  <!-- Card 1 -->
  <rect x="40" y="128" width="250" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="66" cy="156" r="12" fill="#0f2a1d" stroke="#3fb950"/>
  <text x="66" y="160.5" fill="#d2f8d2" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">1</text>
  <text x="88" y="161" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">Install</text>
  <text x="60" y="194" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">pacman -S --needed</text>
  <text x="60" y="214" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">paru -S --needed</text>
  <text x="60" y="252" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Use the normal package</text>
  <text x="60" y="269" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">manager first.</text>

  <!-- Card 2 -->
  <rect x="330" y="128" width="250" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="356" cy="156" r="12" fill="#211a35" stroke="#bc8cff"/>
  <text x="356" y="160.5" fill="#eadcff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">2</text>
  <text x="378" y="161" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">Record</text>
  <text x="350" y="194" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">arch/packages/base.txt</text>
  <text x="350" y="214" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">arch/packages/aur*.txt</text>
  <text x="350" y="252" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">One name per line.</text>
  <text x="350" y="269" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Comments are allowed.</text>

  <!-- Card 3 -->
  <rect x="620" y="128" width="250" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="646" cy="156" r="12" fill="#0d2444" stroke="#58a6ff"/>
  <text x="646" y="160.5" fill="#cfe8ff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">3</text>
  <text x="668" y="161" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">Audit</text>
  <text x="640" y="194" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">just audit native</text>
  <text x="640" y="214" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="10.5">audit.sh --profile wsl --check</text>
  <text x="640" y="252" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Reports missing, untracked,</text>
  <text x="640" y="269" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">and AUR drift.</text>

  <!-- Card 4 -->
  <rect x="910" y="128" width="250" height="172" rx="14" fill="#161b22" stroke="#30363d"/>
  <circle cx="936" cy="156" r="12" fill="#2b210d" stroke="#d29922"/>
  <text x="936" y="160.5" fill="#f8e3a3" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11" font-weight="700" text-anchor="middle">4</text>
  <text x="958" y="161" fill="#e6edf3" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650">Commit</text>
  <text x="930" y="194" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">type(scope): summary</text>
  <text x="930" y="214" fill="#c9d1d9" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="11">but status / but diff</text>
  <text x="930" y="252" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">Keep the list change with</text>
  <text x="930" y="269" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">the reason for it.</text>

  <!-- Arrows -->
  <path d="M 292 214 L 320 214" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 582 214 L 610 214" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 872 214 L 900 214" stroke="#3fb950" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Loop back -->
  <path d="M 1035 302 L 1035 326 L 165 326 L 165 304" fill="none" stroke="#6e7681" stroke-width="1.4" stroke-dasharray="5 5" marker-end="url(#arrow-muted)"/>
  <rect x="534" y="315" width="132" height="22" rx="11" fill="#0d1117" stroke="#30363d"/>
  <text x="600" y="330.5" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace" font-size="9.5" letter-spacing="0.7" text-anchor="middle">REPEAT ON DRIFT</text>

  <text x="48" y="370" fill="#6e7681" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5">The bootstrap never removes packages. Untracked packages are reported, not guessed away.</text>
</svg>
