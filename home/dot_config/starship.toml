# Inspired by basecamp/omarchy's starship prompt.
add_newline = true
command_timeout = 200
format = "[$directory$git_branch]($style)${custom.gitbutler}$git_status$character"

[character]
error_symbol = "[✗](bold cyan)"
success_symbol = "[❯](bold cyan)"

[directory]
truncation_length = 2
truncation_symbol = "…/"
repo_root_style = "bold cyan"
repo_root_format = "[$repo_root]($repo_root_style)[$path]($style)[$read_only]($read_only_style) "

[git_branch]
format = "[$branch]($style) "
style = "italic cyan"
# GitButler parks the checkout on its synthetic workspace branch; the custom
# module below renders the applied stacks instead.
ignore_branches = ["gitbutler/workspace"]

[git_status]
format = '[$all_status]($style)'
style = "cyan"
ahead = "⇡${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
behind = "⇣${count} "
conflicted = "✖ "
up_to_date = "✓ "
untracked = "? "
modified = "● "
stashed = ""
staged = ""
renamed = ""
deleted = ""

# GitButler stacks, rendered by ~/.local/bin/gitbutler-branch.sh. The script
# prints nothing outside a GitButler workspace, so $git_branch above keeps
# handling ordinary repositories. In single-branch mode $git_branch already
# shows the checked-out branch, so the script prints ids only and marks it
# with ▸; workspace mode keeps the names. The script bounds `but status` itself
# because that can outlast the prompt-wide command_timeout.
[custom.gitbutler]
command = "~/.local/bin/gitbutler-branch.sh"
description = "GitButler stacks"
when = true
shell = ["bash", "--noprofile", "--norc"]
format = "([$output]($style) )"
style = "italic cyan"
ignore_timeout = true
