name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly canary for rolling-package and upstream-tool changes.
    - cron: "0 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      # Pinned to archlinux:base-20261025.0.616225 so the base layer does not
      # move underneath a workflow run. Update deliberately; `pacman -Syu`
      # below still picks up current Arch packages.
      image: archlinux@sha256:e82623936fa1a69700b48e98b058df6eaab18b737c27473a7234a40fdecb9413
      options: --user root
    steps:
      # actions/cache uses zstd, which the minimal Arch image does not include.
      - name: Install cache helper
        run: pacman -Sy --noconfirm --needed zstd

      # Bump the v1 suffix when the tool list changes so stale packages are
      # not reused indefinitely.
      - name: Cache pacman packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /var/cache/pacman/pkg
          key: pacman-${{ runner.os }}-v1
          restore-keys: |
            pacman-${{ runner.os }}-

      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            actionlint \
            bats \
            ca-certificates \
            chezmoi \
            difftastic \
            fish \
            git \
            git-delta \
            gitleaks \
            jq \
            just \
            openssh \
            shellcheck \
            shfmt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint
        run: ./scripts/lint.sh

      # The provisioning scripts refuse to run as root, so exercise them as a
      # regular user, like a real machine.
      - name: Create test user
        run: useradd --create-home --user-group --shell /bin/bash tester

      - name: Test
        run: runuser -u tester -- env HOME=/home/tester ./scripts/test.sh

  windows-parse:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Arch container cannot lint PowerShell. Parse-only is intentionally
      # dependency-free; PSScriptAnalyzer can be added when the scripts grow.
      - name: Parse PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem provisioning/windows -Filter *.ps1 -Recurse | ForEach-Object {
              $file = $_
              $tokens = $null
              $parseErrors = $null
              [System.Management.Automation.Language.Parser]::ParseFile(
                  $file.FullName, [ref]$tokens, [ref]$parseErrors
              ) | Out-Null
              foreach ($parseError in $parseErrors) {
                  Write-Host "::error file=$($file.FullName),line=$($parseError.Extent.StartLineNumber)::$($parseError.Message)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      # Dependency-free tests for package parsing, categories, aliases, install
      # arguments, and WSL version parsing.
      - name: Test shared PowerShell helpers
        shell: pwsh
        run: ./tests/windows-lib.ps1

      # Applies the tracked settings to a temporary HOME and checks the result.
      - name: Test managed Windows settings
        shell: pwsh
        run: ./tests/windows-settings.ps1
