name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            actionlint \
            bats \
            ca-certificates \
            chezmoi \
            difftastic \
            fish \
            git \
            git-delta \
            gitleaks \
            jq \
            just \
            shellcheck \
            shfmt

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint
        run: ./scripts/lint.sh

      # The provisioning scripts refuse to run as root, so exercise them as a
      # regular user, like a real machine.
      - name: Create test user
        run: useradd --create-home --user-group --shell /bin/bash tester

      - name: Test
        run: runuser -u tester -- env HOME=/home/tester ./scripts/test.sh
