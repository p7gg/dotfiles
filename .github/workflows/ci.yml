name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Bash syntax
        run: |
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r -n1 bash -n

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00b27aa7cb85167568cb48a3838b75f4265f2bca # v2.0.0
        with:
          scandir: .

      - name: Fish syntax and formatting
        run: |
          sudo apt-get update
          sudo apt-get install -y fish
          find home -name '*.fish' -print0 \
            | xargs -0 -r -n1 fish --no-execute
          find home -name '*.fish' -print0 \
            | xargs -0 -r -n1 fish_indent --check

      - name: shfmt
        run: |
          curl -fsSL -o /tmp/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64
          echo "76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf  /tmp/shfmt" \
            | sha256sum -c -
          chmod +x /tmp/shfmt
          find . -name '*.sh' -not -path './.git/*' -print0 \
            | xargs -0 -r /tmp/shfmt -d

      - name: Secret scan
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz" \
            | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --redact --verbose
