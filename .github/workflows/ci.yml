name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: archlinux:latest
      options: --user root
    steps:
      - name: Install tooling
        run: |
          pacman -Syu --noconfirm --needed \
            actionlint \
            bats \
            ca-certificates \
            chezmoi \
            difftastic \
            fish \
            git \
            git-delta \
            gitleaks \
            just \
            shellcheck \
            shfmt

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Lint
        run: ./scripts/lint.sh

      - name: Test
        run: ./scripts/test.sh
